name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # เวอร์ชัน pnpm อ่านจาก packageManager ใน package.json ที่เดียว
      # ถ้าใส่ version ตรงนี้ด้วย action-setup@v4 จะปฏิเสธเพราะระบุซ้ำ
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # จับ config/bundle ของ Worker พังตั้งแต่ CI แทนที่จะไปเจอตอน deploy จริง
      # --dry-run: bundle + validate อย่างเดียว ไม่อัปโหลด ไม่ต้องใช้ CLOUDFLARE_API_TOKEN
      # ใช้ wrangler ตัว local ที่ pin ไว้ (pnpm exec) ไม่ดึงเวอร์ชันใหม่จาก network
      - name: Deploy dry-run
        run: pnpm exec wrangler deploy --dry-run
