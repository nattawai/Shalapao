<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shalapao</title>
    <style>
      :root {
        --line: #06c755;
        --bg: #f7f8fa;
        --card: #fff;
        --text: #1a1a1a;
        --muted: #8a8f98;
        --border: #e5e7eb;
        --danger: #d92d20;
        --pos: #067d3f;
      }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 16px; line-height: 1.5; margin: 0; color: var(--text); background: var(--bg);
      }
      #app { max-width: 480px; margin: 0 auto; min-height: 100vh; }
      header {
        display: flex; align-items: center; gap: 8px;
        padding: 14px 16px; background: var(--card); border-bottom: 1px solid var(--border);
        position: sticky; top: 0; z-index: 5;
      }
      header h1 { font-size: 18px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .back {
        background: none; border: 0; font-size: 22px; line-height: 1; padding: 0 4px;
        color: var(--muted); cursor: pointer; width: auto;
      }
      main { padding: 16px; }
      .screen[hidden] { display: none; }

      /* กระเป๋า */
      .pocket {
        display: flex; align-items: baseline; gap: 8px;
        width: 100%; text-align: left; background: var(--card);
        border: 0; border-bottom: 1px solid var(--border);
        padding: 14px 16px; font-size: 16px; color: var(--text); cursor: pointer;
      }
      .pocket-list { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
      .pocket:last-child { border-bottom: 0; }
      .pocket .name { flex: 1; }
      .pocket.child .name::before { content: '└ '; color: var(--muted); }
      .pocket.child { padding-left: 32px; }
      .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
      .amount.neg { color: var(--danger); }
      .empty { text-align: center; color: var(--muted); padding: 40px 16px; }

      label { display: block; font-size: 14px; color: var(--muted); margin: 16px 0 4px; }
      input, select, button { font-size: 16px; font-family: inherit; }
      input, select {
        width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
        background: var(--card); color: var(--text);
      }
      .btn {
        width: 100%; padding: 14px; margin-top: 20px; border: 0; border-radius: 10px;
        background: var(--line); color: #fff; font-weight: 600; cursor: pointer;
      }
      .btn:disabled { opacity: .5; cursor: default; }
      .btn-ghost {
        width: 100%; padding: 14px; margin-top: 12px; border: 1px solid var(--border);
        border-radius: 10px; background: var(--card); color: var(--text); cursor: pointer;
      }
      .form-error { color: var(--danger); font-size: 14px; margin-top: 12px; min-height: 20px; }

      /* สลับเงินออก/เงินเข้า — เลือกก่อน ผู้ใช้ไม่ต้องพิมพ์เครื่องหมายลบ */
      .seg { display: flex; gap: 8px; }
      .seg button { flex: 1; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); cursor: pointer; font-weight: 600; }
      .seg button.active { color: #fff; }
      .seg button.active[data-type="out"] { background: var(--danger); border-color: var(--danger); }
      .seg button.active[data-type="in"] { background: var(--pos); border-color: var(--pos); }

      /* รายการเดินบัญชี */
      .entry { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--card); }
      .entry:last-child { border-bottom: 0; }
      .entry .date { font-size: 13px; color: var(--muted); }
      .entry .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
      .entry .amt.in { color: var(--pos); }
      .entry .amt.out { color: var(--danger); }
      .list-card { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04); }

      #banner {
        margin: 16px; padding: 14px 16px; border-radius: 10px;
        background: #fef3f2; border: 1px solid #fecdca; color: var(--danger);
      }
      #banner[hidden] { display: none; }
      #banner button {
        margin-top: 10px; padding: 8px 14px; border: 1px solid var(--danger);
        background: none; color: var(--danger); border-radius: 8px; cursor: pointer; width: auto;
      }
      #gate { text-align: center; padding: 80px 24px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="banner" hidden><span id="bannerText"></span><br /><button id="bannerRetry" hidden>ลองใหม่</button></div>

      <!-- เปิดนอกแอป LINE -->
      <div id="gate" hidden>เปิดจากแอป LINE เท่านั้น</div>

      <!-- หน้าจอ 1: รายการกระเป๋า -->
      <section id="screen-list" class="screen" hidden>
        <header><h1>กระเป๋าของฉัน</h1></header>
        <main>
          <div id="pockets"><p class="empty">กำลังโหลด…</p></div>
          <button class="btn" id="goEntry">＋ เพิ่มรายการ</button>
          <button class="btn-ghost" id="goTransfer">โยกเงินระหว่างกระเป๋า</button>
          <button class="btn-ghost" id="goCreate">สร้างกระเป๋าใหม่</button>
        </main>
      </section>

      <!-- หน้าจอ 2: สร้างกระเป๋า -->
      <section id="screen-create" class="screen" hidden>
        <header>
          <button class="back" data-back aria-label="กลับ">‹</button>
          <h1>สร้างกระเป๋า</h1>
        </header>
        <main>
          <label for="cpName">ชื่อกระเป๋า</label>
          <input id="cpName" type="text" placeholder="เช่น KBank, เงินเก็บ" />
          <label for="cpParent">กระเป๋าแม่ (ไม่บังคับ)</label>
          <select id="cpParent"></select>
          <button class="btn" id="cpSubmit">สร้าง</button>
          <div class="form-error" id="cpError"></div>
        </main>
      </section>

      <!-- หน้าจอ 3: เพิ่มรายการ -->
      <section id="screen-entry" class="screen" hidden>
        <header>
          <button class="back" data-back aria-label="กลับ">‹</button>
          <h1>เพิ่มรายการ</h1>
        </header>
        <main>
          <div class="seg" id="enSeg">
            <button type="button" data-type="out" class="active">เงินออก</button>
            <button type="button" data-type="in">เงินเข้า</button>
          </div>
          <label for="enPocket">กระเป๋า</label>
          <select id="enPocket"></select>
          <label for="enBaht">จำนวนเงิน (บาท)</label>
          <input id="enBaht" type="text" inputmode="decimal" placeholder="0.00" />
          <label for="enDate">วันที่</label>
          <input id="enDate" type="date" />
          <label for="enNote">บันทึก (ไม่บังคับ)</label>
          <input id="enNote" type="text" placeholder="เช่น ค่ากาแฟ" />
          <button class="btn" id="enSubmit">บันทึก</button>
          <div class="form-error" id="enError"></div>
        </main>
      </section>

      <!-- หน้าจอ 4: โยกเงิน -->
      <section id="screen-transfer" class="screen" hidden>
        <header>
          <button class="back" data-back aria-label="กลับ">‹</button>
          <h1>โยกเงิน</h1>
        </header>
        <main>
          <label for="tfFrom">จาก</label>
          <select id="tfFrom"></select>
          <label for="tfTo">ไป</label>
          <select id="tfTo"></select>
          <label for="tfBaht">จำนวนเงิน (บาท)</label>
          <input id="tfBaht" type="text" inputmode="decimal" placeholder="0.00" />
          <button class="btn" id="tfSubmit">โยกเงิน</button>
          <div class="form-error" id="tfError"></div>
        </main>
      </section>

      <!-- หน้ารายการเดินบัญชี -->
      <section id="screen-statement" class="screen" hidden>
        <header>
          <button class="back" data-back aria-label="กลับ">‹</button>
          <h1 id="stTitle">รายการ</h1>
        </header>
        <main><div id="stList"><p class="empty">กำลังโหลด…</p></div></main>
      </section>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
      const LIFF_ID = '2011608646-o7VPOT1u';
      let idToken = null;
      let pocketsCache = [];

      // ---------- เงิน: API เป็นสตางค์จำนวนเต็ม · จอเป็นบาท ----------
      // แสดงผลเท่านั้น — ห้ามเอาค่าที่หารแล้วไปคำนวณต่อ
      function formatBaht(satang) {
        return (satang / 100).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      // บาทที่ผู้ใช้กรอก → สตางค์ · ตรวจรูปแบบด้วย regex ก่อน parse — parseFloat รับขยะต่อท้าย
      // ('100abc'→100, '1e5'→100000) จึงต้องกันเอง: ตัวเลข + ทศนิยมไม่เกิน 2 ตำแหน่งเท่านั้น
      // Math.round เพราะ baht*100 บน float อาจได้ 6099.999
      function bahtToSatang(bahtStr) {
        const s = String(bahtStr).trim();
        if (!/^\d+(\.\d{1,2})?$/.test(s)) {
          throw new Error('จำนวนเงินไม่ถูกต้อง — ใส่เฉพาะตัวเลข ทศนิยมไม่เกิน 2 ตำแหน่ง');
        }
        return Math.round(parseFloat(s) * 100);
      }
      function todayBangkok() {
        return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date());
      }

      // ---------- เรียก API: ใส่ Authorization ให้ · โยน error พร้อม message ไทย ----------
      async function api(method, path, body) {
        let res;
        try {
          res = await fetch(path, {
            method,
            headers: {
              Authorization: 'Bearer ' + idToken,
              ...(body ? { 'Content-Type': 'application/json' } : {})
            },
            ...(body ? { body: JSON.stringify(body) } : {})
          });
        } catch (_) {
          throw new Error('เชื่อมต่อไม่ได้ ตรวจสัญญาณแล้วลองใหม่');
        }
        if (res.status === 401) throw new Error('เซสชันหมดอายุ ปิดแล้วเปิดใหม่จาก LINE');
        const text = await res.text();
        if (!res.ok) {
          // API ตอบ { error, message } โดย message เป็นไทยที่บอกทางออกแล้ว — แสดงตรง ๆ
          let message = 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง';
          try { const j = JSON.parse(text); if (j && j.message) message = j.message; } catch (_) {}
          throw new Error(message);
        }
        return text ? JSON.parse(text) : null;
      }

      // ---------- สลับหน้าจอ ----------
      function show(screenId) {
        for (const s of document.querySelectorAll('.screen')) s.hidden = s.id !== screenId;
        window.scrollTo(0, 0);
      }

      // ---------- แถบ error กลางหน้า ----------
      function showBanner(message, retryFn) {
        document.getElementById('bannerText').textContent = message;
        const btn = document.getElementById('bannerRetry');
        btn.hidden = !retryFn;
        btn.onclick = retryFn || null;
        document.getElementById('banner').hidden = false;
      }
      function clearBanner() { document.getElementById('banner').hidden = true; }

      function fillPocketOptions(sel, placeholder) {
        sel.innerHTML = placeholder ? '<option value="">' + placeholder + '</option>' : '';
        for (const p of pocketsCache) {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.name;
          sel.appendChild(opt);
        }
      }

      // ---------- หน้าจอ 1: รายการกระเป๋า ----------
      // เรียงพ่อก่อนแล้วตามด้วยลูกของมัน (parentId) · v0 รองรับชั้นเดียว
      function orderByParent(pockets) {
        const byId = new Set(pockets.map((p) => p.id));
        const children = new Map();
        const tops = [];
        for (const p of pockets) {
          if (p.parentId && byId.has(p.parentId)) {
            if (!children.has(p.parentId)) children.set(p.parentId, []);
            children.get(p.parentId).push(p);
          } else {
            tops.push(p);
          }
        }
        const out = [];
        for (const p of tops) {
          out.push({ pocket: p, child: false });
          for (const c of children.get(p.id) || []) out.push({ pocket: c, child: true });
        }
        return out;
      }

      function renderPockets(pockets) {
        const host = document.getElementById('pockets');
        host.innerHTML = '';
        if (pockets.length === 0) {
          host.innerHTML = '<div class="empty">ยังไม่มีกระเป๋า<br />เริ่มจากสร้างใบแรกด้านล่าง</div>';
          return;
        }
        const list = document.createElement('div');
        list.className = 'pocket-list';
        for (const { pocket, child } of orderByParent(pockets)) {
          const row = document.createElement('button');
          row.className = 'pocket' + (child ? ' child' : '');
          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = pocket.name;
          const amt = document.createElement('span');
          amt.className = 'amount' + (pocket.balanceSatang < 0 ? ' neg' : '');
          amt.textContent = formatBaht(pocket.balanceSatang);
          row.append(name, amt);
          row.addEventListener('click', () => openStatement(pocket));
          list.appendChild(row);
        }
        host.appendChild(list);
      }

      async function loadPockets() {
        try {
          const { pockets } = await api('GET', '/api/pockets');
          pocketsCache = pockets;
          clearBanner();
          renderPockets(pockets);
        } catch (err) {
          showBanner(err.message, loadPockets);
          throw err;
        }
      }

      // ---------- หน้าจอ 2: สร้างกระเป๋า ----------
      function openCreate() {
        document.getElementById('cpName').value = '';
        document.getElementById('cpError').textContent = '';
        fillPocketOptions(document.getElementById('cpParent'), '— ไม่มีกระเป๋าแม่ —');
        show('screen-create');
      }

      async function submitCreate() {
        const name = document.getElementById('cpName').value.trim();
        const errEl = document.getElementById('cpError');
        if (!name) { errEl.textContent = 'ใส่ชื่อกระเป๋าก่อน'; return; }
        const parentId = document.getElementById('cpParent').value;
        const btn = document.getElementById('cpSubmit');
        btn.disabled = true;
        errEl.textContent = '';
        try {
          await api('POST', '/api/pockets', parentId ? { name, parentId } : { name });
          await loadPockets();
          show('screen-list');
        } catch (err) {
          errEl.textContent = err.message;
        } finally {
          btn.disabled = false;
        }
      }

      // ---------- หน้าจอ 3: เพิ่มรายการ ----------
      let entryType = 'out'; // ดีฟอลต์เงินออก · โค้ดใส่เครื่องหมายเอง ผู้ใช้ไม่พิมพ์ลบ
      let entryDateTouched = false;

      function openEntry() {
        if (pocketsCache.length === 0) { showBanner('ยังไม่มีกระเป๋า — สร้างกระเป๋าก่อนจึงจะเพิ่มรายการได้'); return; }
        entryType = 'out';
        for (const b of document.querySelectorAll('#enSeg button')) b.classList.toggle('active', b.dataset.type === 'out');
        fillPocketOptions(document.getElementById('enPocket'), null);
        document.getElementById('enBaht').value = '';
        document.getElementById('enNote').value = '';
        document.getElementById('enDate').value = todayBangkok();
        entryDateTouched = false;
        document.getElementById('enError').textContent = '';
        show('screen-entry');
      }

      async function submitEntry() {
        const errEl = document.getElementById('enError');
        errEl.textContent = '';
        let magnitude;
        try {
          magnitude = bahtToSatang(document.getElementById('enBaht').value);
        } catch (err) {
          errEl.textContent = err.message; return;
        }
        if (magnitude === 0) { errEl.textContent = 'จำนวนเงินต้องมากกว่า 0'; return; }
        // เงินออก = ติดลบ · เงินเข้า = บวก — เครื่องหมายมาจากปุ่มที่เลือก
        const amountSatang = entryType === 'out' ? -magnitude : magnitude;
        const body = { pocketId: document.getElementById('enPocket').value, amountSatang };
        // ไม่แก้วันที่ → ไม่ส่ง occurredOn ปล่อย backend ใส่วันไทยเอง
        if (entryDateTouched) body.occurredOn = document.getElementById('enDate').value;
        const note = document.getElementById('enNote').value.trim();
        if (note) body.note = note;

        const btn = document.getElementById('enSubmit');
        btn.disabled = true;
        try {
          await api('POST', '/api/entries', body);
          await loadPockets(); // เห็นยอดเปลี่ยนทันที
          show('screen-list');
        } catch (err) {
          errEl.textContent = err.message; // รวม 409 ทับงวดกระทบยอด — message บอกทางออกแล้ว
        } finally {
          btn.disabled = false;
        }
      }

      // ---------- หน้าจอ 4: โยกเงิน ----------
      function openTransfer() {
        if (pocketsCache.length < 2) { showBanner('ต้องมีอย่างน้อยสองกระเป๋าจึงจะโยกเงินได้'); return; }
        fillPocketOptions(document.getElementById('tfFrom'), null);
        fillPocketOptions(document.getElementById('tfTo'), null);
        document.getElementById('tfTo').selectedIndex = 1; // ปลายทางเริ่มที่ใบอื่น กันซ้ำต้นทาง
        document.getElementById('tfBaht').value = '';
        validateTransfer();
        show('screen-transfer');
      }

      // กันเลือกกระเป๋าเดียวกันตั้งแต่หน้าจอ (backend กันอยู่แล้ว แต่อย่าให้กดแล้วค่อยโดนปฏิเสธ)
      function validateTransfer() {
        const from = document.getElementById('tfFrom').value;
        const to = document.getElementById('tfTo').value;
        const errEl = document.getElementById('tfError');
        const same = from === to;
        errEl.textContent = same ? 'เลือกกระเป๋าปลายทางที่ต่างจากต้นทาง' : '';
        document.getElementById('tfSubmit').disabled = same;
      }

      async function submitTransfer() {
        const errEl = document.getElementById('tfError');
        const fromPocketId = document.getElementById('tfFrom').value;
        const toPocketId = document.getElementById('tfTo').value;
        if (fromPocketId === toPocketId) { errEl.textContent = 'เลือกกระเป๋าปลายทางที่ต่างจากต้นทาง'; return; }
        let amountSatang;
        try {
          amountSatang = bahtToSatang(document.getElementById('tfBaht').value);
        } catch (err) {
          errEl.textContent = err.message; return;
        }
        if (amountSatang === 0) { errEl.textContent = 'จำนวนเงินต้องมากกว่า 0'; return; }
        const btn = document.getElementById('tfSubmit');
        btn.disabled = true;
        errEl.textContent = '';
        try {
          await api('POST', '/api/transfers', { fromPocketId, toPocketId, amountSatang });
          await loadPockets();
          show('screen-list');
        } catch (err) {
          errEl.textContent = err.message;
        } finally {
          btn.disabled = false;
        }
      }

      // ---------- หน้ารายการเดินบัญชี ----------
      function renderEntries(entries) {
        const host = document.getElementById('stList');
        host.innerHTML = '';
        if (entries.length === 0) { host.innerHTML = '<div class="empty">ยังไม่มีรายการในกระเป๋านี้</div>'; return; }
        const card = document.createElement('div');
        card.className = 'list-card';
        for (const e of entries) {
          const row = document.createElement('div');
          row.className = 'entry';
          const meta = document.createElement('div');
          const date = document.createElement('div');
          date.className = 'date';
          date.textContent = e.occurredOn;
          const note = document.createElement('div');
          note.textContent = e.note || (e.source === 'reconcile' ? 'ปรับยอดจากการเช็คยอด' : '—');
          meta.append(date, note);
          const amt = document.createElement('div');
          amt.className = 'amt ' + (e.amountSatang < 0 ? 'out' : 'in');
          amt.textContent = formatBaht(e.amountSatang);
          row.append(meta, amt);
          card.appendChild(row);
        }
        host.appendChild(card);
      }

      async function openStatement(pocket) {
        document.getElementById('stTitle').textContent = pocket.name;
        document.getElementById('stList').innerHTML = '<p class="empty">กำลังโหลด…</p>';
        show('screen-statement');
        const load = async () => {
          try {
            const { entries } = await api('GET', '/api/pockets/' + encodeURIComponent(pocket.id) + '/entries');
            clearBanner();
            renderEntries(entries);
          } catch (err) {
            document.getElementById('stList').innerHTML = '';
            showBanner(err.message, load);
          }
        };
        await load();
      }

      // ---------- wiring ----------
      document.getElementById('goEntry').addEventListener('click', openEntry);
      document.getElementById('goTransfer').addEventListener('click', openTransfer);
      document.getElementById('goCreate').addEventListener('click', openCreate);
      document.getElementById('cpSubmit').addEventListener('click', submitCreate);
      document.getElementById('enSubmit').addEventListener('click', submitEntry);
      document.getElementById('tfSubmit').addEventListener('click', submitTransfer);
      document.getElementById('enDate').addEventListener('input', () => { entryDateTouched = true; });
      document.getElementById('tfFrom').addEventListener('change', validateTransfer);
      document.getElementById('tfTo').addEventListener('change', validateTransfer);
      for (const b of document.querySelectorAll('#enSeg button')) {
        b.addEventListener('click', () => {
          entryType = b.dataset.type;
          for (const x of document.querySelectorAll('#enSeg button')) x.classList.toggle('active', x === b);
        });
      }
      // ปุ่มกลับทุกหน้า → หน้าแรก (v0 มีชั้นเดียว ไม่ต้องมี history stack)
      for (const b of document.querySelectorAll('[data-back]')) b.addEventListener('click', () => show('screen-list'));

      // ---------- เริ่มต้น: LIFF init ครั้งเดียว ----------
      (async function init() {
        try {
          await liff.init({ liffId: LIFF_ID });
        } catch (_) {
          document.getElementById('gate').textContent = 'เริ่มต้นไม่สำเร็จ ปิดแล้วเปิดใหม่จาก LINE';
          document.getElementById('gate').hidden = false;
          return;
        }
        if (!liff.isLoggedIn()) { liff.login(); return; }
        idToken = liff.getIDToken();
        if (!idToken) {
          document.getElementById('gate').hidden = false; // "เปิดจากแอป LINE เท่านั้น"
          return;
        }
        show('screen-list');
        loadPockets().catch(() => {});
      })();
    </script>
  </body>
</html>
