<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shalapao — smoke v2</title>
    <style>
      /* แค่พออ่านออกบนมือถือ — นี่คือหน้า debug ไม่ใช่ UI จริง */
      body { font-family: system-ui, sans-serif; font-size: 16px; margin: 0; padding: 16px; line-height: 1.5; }
      h1 { font-size: 18px; }
      section { margin: 20px 0; padding-top: 12px; border-top: 1px solid #ccc; }
      input, select, button { font-size: 16px; padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
      button { background: #06c755; color: #fff; border: 0; border-radius: 6px; }
      ul { padding-left: 18px; }
      pre { background: #f4f4f4; padding: 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>Shalapao smoke v2</h1>
    <p>หน้าทดสอบชั่วคราว — บันทึกเงินจริงจากมือถือเพื่อพิสูจน์ API · ไม่ใช่หน้าจอจริง</p>

    <section id="me">ตัวตน: กำลังโหลด…</section>

    <section>
      <h1>กระเป๋า</h1>
      <ul id="pockets">
        <li>กำลังโหลด…</li>
      </ul>
    </section>

    <section>
      <h1>สร้างกระเป๋า</h1>
      <input id="newPocketName" placeholder="ชื่อกระเป๋า" />
      <button id="createPocket">สร้าง</button>
    </section>

    <section>
      <h1>เพิ่มรายการ</h1>
      <select id="entryPocket"></select>
      <input id="entryBaht" type="text" inputmode="decimal" placeholder="จำนวนเงิน (บาท) · บวก=เข้า ลบ=ออก" />
      <button id="addEntry">บันทึก</button>
    </section>

    <section>
      <h1>log ดิบ (debug)</h1>
      <pre id="log"></pre>
    </section>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
      const logEl = document.getElementById('log');
      function log(line) {
        logEl.textContent += line + '\n\n';
      }

      let idToken = null;

      // เรียก API พร้อม Authorization — ถ้าไม่ใช่ 2xx โยน error พร้อม status + body ดิบ
      // (จุดประสงค์ของหน้านี้คือ debug ห้ามกลืน error ห้ามแสดงแค่ "เกิดข้อผิดพลาด")
      async function api(method, path, body) {
        const res = await fetch(path, {
          method,
          headers: {
            Authorization: 'Bearer ' + idToken,
            ...(body ? { 'Content-Type': 'application/json' } : {})
          },
          ...(body ? { body: JSON.stringify(body) } : {})
        });
        const text = await res.text();
        log(method + ' ' + path + ' → ' + res.status + '\n' + text);
        if (!res.ok) throw new Error(res.status + ' ' + text);
        return text ? JSON.parse(text) : null;
      }

      // สตางค์ → บาท เพื่อ "แสดงผล" เท่านั้น · ห้ามเอาค่าที่หารแล้วไปคำนวณต่อ
      function satangToBaht(satang) {
        return (satang / 100).toFixed(2);
      }

      // บาท (ผู้ใช้กรอก) → สตางค์ (API รับ) · ต้อง Math.round เพราะ baht*100 บน float
      // อาจได้ 6099.99999 → ต้องปัดเป็นจำนวนเต็ม ห้ามส่งทศนิยม (zod จะปฏิเสธ ซึ่งถูกแล้ว)
      function bahtToSatang(bahtStr) {
        const baht = parseFloat(bahtStr);
        if (Number.isNaN(baht)) throw new Error('จำนวนเงินไม่ถูกต้อง: ' + bahtStr);
        return Math.round(baht * 100);
      }

      async function loadPockets() {
        const { pockets } = await api('GET', '/api/pockets');
        const ul = document.getElementById('pockets');
        const sel = document.getElementById('entryPocket');
        ul.innerHTML = '';
        sel.innerHTML = '';
        if (pockets.length === 0) ul.innerHTML = '<li>(ยังไม่มีกระเป๋า)</li>';
        for (const p of pockets) {
          const li = document.createElement('li');
          li.textContent = p.name + ' · ' + p.kind + ' · ' + satangToBaht(p.balanceSatang) + ' บาท';
          ul.appendChild(li);
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.name;
          sel.appendChild(opt);
        }
      }

      document.getElementById('createPocket').addEventListener('click', async () => {
        try {
          const name = document.getElementById('newPocketName').value.trim();
          await api('POST', '/api/pockets', { name });
          document.getElementById('newPocketName').value = '';
          await loadPockets();
        } catch (err) {
          log('สร้างกระเป๋าไม่สำเร็จ: ' + err.message);
        }
      });

      document.getElementById('addEntry').addEventListener('click', async () => {
        try {
          const pocketId = document.getElementById('entryPocket').value;
          const amountSatang = bahtToSatang(document.getElementById('entryBaht').value);
          await api('POST', '/api/entries', { pocketId, amountSatang });
          document.getElementById('entryBaht').value = '';
          await loadPockets(); // ลิสต์ใหม่ให้เห็นยอดเปลี่ยน
        } catch (err) {
          log('เพิ่มรายการไม่สำเร็จ: ' + err.message);
        }
      });

      (async function () {
        try {
          await liff.init({ liffId: '2011608646-o7VPOT1u' });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          idToken = liff.getIDToken();
          const me = await api('GET', '/api/me');
          document.getElementById('me').textContent = 'ตัวตน: ' + me.displayName + ' (' + me.userId + ')';
          await loadPockets();
        } catch (err) {
          document.getElementById('me').textContent = 'เริ่มไม่สำเร็จ';
          log('init ERROR: ' + (err && err.message ? err.message : String(err)));
        }
      })();
    </script>
  </body>
</html>
